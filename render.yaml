# Render Blueprint — https://render.com/docs/blueprint-spec
# NOTE: this file only drives the service when it is deployed as a Blueprint.
# The live service is configured manually in the dashboard as:
#   Root Directory   : src
#   Build Command    : npm install; npm run build
#   Publish Directory: dist
# Both resolve to the same folder, because vite.config.js writes the bundle
# to src/dist (see build.outDir there). Keep the two in sync.
services:
  - type: web
    name: humovare-launch
    runtime: static

    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: ./src/dist

    envVars:
      - key: NODE_VERSION
        value: "22.11.0"

    # Single-page app: anything that is not a real file falls back to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Fingerprinted bundles (index-aAY2kdHw.js, etc.) never change: cache hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The HTML shell must always be revalidated or deploys go unnoticed.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
