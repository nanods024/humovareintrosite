<!--
  ============================================================
  PLACEHOLDER ONLY. NOT THE OFFICIAL HUMOVARE LOGO.
  ============================================================
  Replace with the official artwork:
    1. Save the official logo as  src/assets/humovare-logo.png
    2. In src/components/Logo.jsx change the single import line:
         import logoSrc from '../assets/humovare-logo.svg'
       to
         import logoSrc from '../assets/humovare-logo.png'
  The layout is built for a SQUARE red tile (1:1), exactly like
  the official artwork, so nothing else needs to change and the
  logo is never stretched or re-proportioned.
  ============================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="HUMOVARE">
  <defs>
    <radialGradient id="tile" cx="64%" cy="74%" r="98%">
      <stop offset="0%" stop-color="#cf1f27"/>
      <stop offset="52%" stop-color="#ab141c"/>
      <stop offset="100%" stop-color="#780b11"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#3d0509" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#tile)"/>

  <g filter="url(#drop)">
    <!-- H, built as slabs so it never depends on an installed font -->
    <path d="M90 400 h78 v245 h-78 z" fill="#ffffff"/>
    <path d="M252 400 h78 v245 h-78 z" fill="#ffffff"/>
    <path d="M90 485 h240 v60 h-240 z" fill="#ffffff"/>

    <!-- walking figure with cane, set inside the left stem -->
    <g transform="translate(-56,0)" stroke="#0b0b0b" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="181" cy="440" r="12" fill="#0b0b0b" stroke="none"/>
      <path d="M181 454 L175 524" stroke-width="13"/>
      <path d="M177 472 L163 508" stroke-width="10"/>
      <path d="M181 470 L198 500" stroke-width="10"/>
      <path d="M175 524 L166 578 L161 612" stroke-width="12"/>
      <path d="M175 524 L192 566 L200 610" stroke-width="12"/>
      <path d="M202 436 L208 612" stroke-width="7"/>
    </g>

    <!-- textLength pins the width so the mark looks the same on every machine -->
    <text x="348" y="640" textLength="472" lengthAdjust="spacingAndGlyphs"
          font-family="Archivo Black, Arial Black, Arial, Helvetica, sans-serif"
          font-weight="900" font-size="258" fill="#ffffff">umo</text>
    <circle cx="866" cy="612" r="29" fill="#ffffff"/>
  </g>

  <text x="672" y="702" textLength="188" lengthAdjust="spacing"
        font-family="Archivo, Arial, Helvetica, sans-serif"
        font-weight="800" font-size="42" fill="#0b0b0b">VARE</text>
</svg>
